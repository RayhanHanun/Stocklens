<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stocklens | Pro Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { cyan: { 400: '#22d3ee', 500: '#06b6d4' }, fuchsia: { 400: '#e879f9', 500: '#d946ef' } },
                    animation: { 'pulse-slow': "pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite" }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { bg: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-card { background: linear-gradient(145deg, rgba(30, 41, 59, 0.4), rgba(15, 23, 42, 0.6)); backdrop-filter: blur(16px); border: 1px solid rgba(148, 163, 184, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .text-glow-cyan { text-shadow: 0 0 10px rgba(34, 211, 238, 0.5); }
        .text-glow-pink { text-shadow: 0 0 10px rgba(232, 121, 249, 0.5); }
        .bg-grid { background-size: 40px 40px; background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px); }
    </style>
</head>
<body class="bg-[#050b14] text-slate-300 font-sans min-h-screen overflow-x-hidden bg-grid relative">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-cyan-500/20 rounded-full mix-blend-overlay filter blur-3xl opacity-30"></div>
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-fuchsia-500/20 rounded-full mix-blend-overlay filter blur-3xl opacity-30"></div>
    </div>

    <div id="loadingOverlay" class="fixed inset-0 z-[100] bg-[#050b14] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="relative flex items-center justify-center mb-4">
            <div class="w-16 h-16 border-4 border-cyan-500/20 border-t-cyan-400 rounded-full animate-spin"></div>
            <i class="fas fa-radar absolute text-cyan-400 text-xl animate-pulse-slow"></i>
        </div>
        <p class="text-cyan-400 font-mono text-sm tracking-widest uppercase animate-pulse">Initializing Core System...</p>
    </div>

    <nav class="glass sticky top-0 z-40 border-b-0">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="relative w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center border border-slate-700">
                    <i class="fas fa-chart-simple text-cyan-400"></i>
                </div>
                <h1 class="text-2xl font-black italic uppercase bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Stocklens</h1>
            </div>
            <div id="market-badge" class="glass px-5 py-2 rounded-full text-xs font-bold uppercase tracking-widest flex items-center gap-2">
                <span class="animate-ping absolute inline-flex h-2 w-2 rounded-full bg-slate-400 opacity-75"></span>
                Syncing...
            </div>
        </div>
    </nav>

    <header class="pt-24 pb-20 px-4 text-center">
        <h2 class="text-5xl md:text-7xl font-extrabold text-white mb-8">
            Next-Gen <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 text-glow-cyan">Stock Scanner.</span>
        </h2>
        <div class="relative max-w-2xl mx-auto group">
            <div class="absolute -inset-1 bg-gradient-to-r from-cyan-500 to-fuchsia-500 rounded-2xl blur opacity-30 group-hover:opacity-60 transition duration-500"></div>
            <div class="relative flex items-center glass-card rounded-xl p-2">
                <i class="fas fa-search ml-4 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Cari Saham (Contoh: BBRI)..." class="w-full bg-transparent border-none focus:ring-0 px-4 py-3 text-white font-bold uppercase tracking-wider">
                <button onclick="searchStock()" class="bg-cyan-600 hover:bg-cyan-500 px-8 py-3 rounded-lg font-bold text-white transition-all">SCAN</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 space-y-16 pb-20">
        <section>
            <div class="flex items-center gap-4 mb-6">
                <div class="h-10 w-10 bg-slate-900 border border-cyan-500/30 rounded-lg flex items-center justify-center"><i class="fas fa-wave-square text-cyan-400"></i></div>
                <div><h3 class="text-2xl font-black text-white text-glow-cyan">SWING PROTOCOL</h3><p class="text-cyan-400/60 text-xs font-mono uppercase">Mid-Term Trend</p></div>
            </div>
            <div class="glass-card rounded-3xl overflow-hidden">
                <table class="w-full text-left"><tbody id="swing-list" class="divide-y divide-slate-800/50"></tbody></table>
            </div>
        </section>

        <section>
            <div class="flex items-center gap-4 mb-6">
                <div class="h-10 w-10 bg-slate-900 border border-fuchsia-500/30 rounded-lg flex items-center justify-center"><i class="fas fa-stopwatch text-fuchsia-400"></i></div>
                <div><h3 class="text-2xl font-black text-white text-glow-pink">SCALPING PROTOCOL</h3><p class="text-fuchsia-400/60 text-xs font-mono uppercase">High-Frequency</p></div>
            </div>
            <div class="glass-card rounded-3xl overflow-hidden">
                <table class="w-full text-left"><tbody id="scalp-list" class="divide-y divide-slate-800/50"></tbody></table>
            </div>
        </section>
    </main>

    <div id="searchModal" class="fixed inset-0 z-[60] bg-slate-900/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass-card max-w-2xl w-full rounded-3xl p-8 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fas fa-times text-2xl"></i></button>
            <div id="searchResultsBody"></div>
        </div>
    </div>

    <script>
        const PATH_DATA = './stock-analyzer/output/signals.json';
        let stockDB = null;

        async function init() {
            try {
                const response = await fetch(`${PATH_DATA}?v=${new Date().getTime()}`);
                if (!response.ok) throw new Error("Gagal mengambil data signals.json");
                stockDB = await response.json();
                renderUI();
                document.getElementById('loadingOverlay').classList.add('opacity-0', 'pointer-events-none');
            } catch (e) {
                console.error(e);
                document.getElementById('loadingOverlay').innerHTML = `<div class="text-center"><i class="fas fa-triangle-exclamation text-rose-500 text-4xl mb-4"></i><p class="text-rose-400 font-bold tracking-widest">DATA NOT FOUND</p><p class="text-slate-500 text-xs mt-2">Pastikan 'scanner.py' sudah dijalankan.</p></div>`;
            }
        }

        function renderUI() {
            const isBullish = stockDB.metadata.market_sentiment.includes('BULLISH');
            document.getElementById('market-badge').innerHTML = `
                <span class="relative flex h-2.5 w-2.5 mr-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full ${isBullish ? 'bg-emerald-400' : 'bg-rose-400'} opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 ${isBullish ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
                </span>
                MARKET: <span class="${isBullish ? 'text-emerald-400' : 'text-rose-400'} ml-1 font-bold">${stockDB.metadata.market_sentiment.split(' ')[0]}</span>`;

            fillTable('swing-list', stockDB.signals.swing, 'Swing', 'cyan');
            fillTable('scalp-list', stockDB.signals.scalping, 'Scalping', 'fuchsia');
        }

        function fillTable(id, data, label, color) {
            const container = document.getElementById(id);
            if (!data || data.length === 0) {
                container.innerHTML = `<tr><td colspan="4" class="p-12 text-center text-slate-500 uppercase tracking-widest text-sm">No ${label} Targets Found</td></tr>`;
                return;
            }
            
            data.sort((a, b) => (b.score || 0) - (a.score || 0));

            let html = `<thead><tr class="text-xs uppercase text-slate-500 border-b border-slate-700/50"><th class="px-6 py-4">Asset</th><th class="px-6 py-4 text-center">Entry</th><th class="px-6 py-4 text-center">Risk</th><th class="px-6 py-4">Reason</th></tr></thead>`;
            
            data.forEach(s => {
                if (!s.entry || !s.sl || !s.tp) return; 
                const scoreColor = (s.score || 0) >= 80 ? 'text-emerald-400' : 'text-blue-400';
                html += `
                <tr class="hover:bg-slate-800/30 transition border-l-2 border-transparent hover:border-${color}-500">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <div class="h-10 w-10 bg-slate-800 rounded flex items-center justify-center font-black text-${color}-400 border border-slate-700">${s.ticker[0]}</div>
                            <div>
                                <div class="font-bold text-white text-lg">${s.ticker}</div>
                                <div class="text-[10px] text-slate-500 bg-slate-900 px-1 rounded inline-block border border-slate-800">SCORE: <b class="${scoreColor}">${s.score || 0}</b></div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <span class="font-mono font-bold text-${color}-400 text-lg">Rp ${s.entry.toLocaleString()}</span>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <div class="text-xs font-mono space-y-1">
                            <div class="text-rose-400"><span class="text-rose-700 font-bold mr-1">SL</span>${s.sl.toLocaleString()}</div>
                            <div class="text-emerald-400"><span class="text-emerald-700 font-bold mr-1">TP</span>${s.tp.toLocaleString()}</div>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <p class="text-xs text-slate-400 italic border-l border-slate-700 pl-3 leading-relaxed">"${s.reason}"</p>
                    </td>
                </tr>`;
            });
            container.innerHTML = html;
        }

        function searchStock() {
            const q = document.getElementById('searchInput').value.toUpperCase();
            if(!q) return;
            const item = stockDB.watchlist.find(x => x.ticker === q);
            const modal = document.getElementById('searchModal');
            const body = document.getElementById('searchResultsBody');
            
            modal.classList.remove('hidden');
            if(!item) {
                body.innerHTML = `<div class="text-center py-10"><h3 class="text-xl font-bold text-rose-500">NOT FOUND</h3><p class="text-slate-400">Ticker ${q} tidak ditemukan.</p></div>`;
            } else {
                body.innerHTML = `
                    <div class="flex items-center gap-4 mb-6 pb-4 border-b border-slate-700">
                        <div class="h-16 w-16 bg-slate-800 rounded-xl flex items-center justify-center text-3xl font-black text-white shadow-lg">${item.ticker.substring(0,2)}</div>
                        <div><h2 class="text-4xl font-black text-white">${item.ticker}</h2><span class="text-xs text-slate-500 uppercase tracking-widest">Analysis Result</span></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${renderCard('SWING', item.swing_status, item.swing_score, item.swing_reason, item.swing_entry, item.swing_sl, item.swing_tp, 'cyan')}
                        ${renderCard('SCALPING', item.scalp_status, item.scalp_score, item.scalp_reason, item.scalp_entry, item.scalp_sl, item.scalp_tp, 'fuchsia')}
                    </div>`;
            }
        }

        // FUNGSI RENDER CARD DIPERBARUI: Menerima Entry, SL, TP
        function renderCard(title, status, score, reason, entry, sl, tp, color) {
            // Cek apakah status valid untuk beli (BUY atau STRONG BUY)
            const isBuy = status.includes('BUY') && !status.includes('DONT');
            const statusColor = isBuy ? 'text-emerald-400' : 'text-rose-400';
            const icon = isBuy ? 'fa-check-circle' : 'fa-times-circle';
            
            // Logic HTML untuk Harga (Hanya muncul jika BUY)
            let priceInfoHtml = '';
            if (isBuy && entry > 0) {
                priceInfoHtml = `
                <div class="grid grid-cols-3 gap-2 mb-4 mt-3 bg-slate-950/50 p-3 rounded-lg border border-slate-800/50 text-center">
                    <div>
                        <div class="text-[9px] text-slate-500 uppercase font-bold mb-1">Entry</div>
                        <div class="font-mono text-sm text-${color}-400 font-bold">${entry.toLocaleString()}</div>
                    </div>
                    <div>
                        <div class="text-[9px] text-slate-500 uppercase font-bold mb-1">Stop Loss</div>
                        <div class="font-mono text-sm text-rose-400 font-bold">${sl.toLocaleString()}</div>
                    </div>
                    <div>
                        <div class="text-[9px] text-slate-500 uppercase font-bold mb-1">Take Profit</div>
                        <div class="font-mono text-sm text-emerald-400 font-bold">${tp.toLocaleString()}</div>
                    </div>
                </div>`;
            }

            return `
            <div class="bg-slate-900/50 p-5 rounded-xl border border-${color}-500/20 relative overflow-hidden flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <div class="text-[10px] font-bold text-${color}-400 uppercase tracking-widest">${title}</div>
                        <i class="fas ${icon} ${statusColor} text-lg"></i>
                    </div>
                    <div class="flex items-center gap-3 mb-2">
                        <div class="text-2xl font-black ${statusColor} tracking-wide">${status}</div>
                        ${score > 0 ? `<div class="text-[10px] bg-slate-950 px-2 py-1 rounded text-${color}-400 border border-${color}-500/30 font-mono">SCORE: ${score}</div>` : ''}
                    </div>
                    <p class="text-xs italic text-slate-400 mb-3">"${reason}"</p>
                </div>
                ${priceInfoHtml}
            </div>`;
        }

        function closeModal() { document.getElementById('searchModal').classList.add('hidden'); }
        document.getElementById('searchInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') searchStock(); });
        init();
    </script>
</body>
</html>
