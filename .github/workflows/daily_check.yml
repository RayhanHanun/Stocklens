name: Daily Stock Analysis

on:
  schedule:
    # 18:00 WIB (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        working-directory: stock-analyzer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Latest Data
        working-directory: stock-analyzer
        run: python scripts/download_yfinance.py

      - name: Run Daily Analysis
        working-directory: stock-analyzer
        run: python scripts/run_daily.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stock-analyzer/data/idx/*.csv stock-analyzer/output/signals.json
          git commit -m "Auto-update: Daily Signals $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
