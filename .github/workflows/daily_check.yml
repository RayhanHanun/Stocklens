name: Daily Stock Analysis

on:
  schedule:
    # 18:00 WIB (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch: # Agar bisa dijalankan manual lewat tombol di GitHub

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Wajib ada permission write agar bot bisa melakukan push kembali ke repository
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        working-directory: stock-analyzer
        run: |
          python -m pip install --upgrade pip
          # Menggunakan file requirements.txt yang ada di folder stock-analyzer
          pip install -r requirements.txt

      - name: Run Daily Analysis
        working-directory: stock-analyzer
        run: python scripts/run_daily.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Menambahkan file signals.json yang berada di folder output
          git add stock-analyzer/output/signals.json
          
          # Commit hanya jika ada perubahan data
          git commit -m "Auto-update: Daily Signals $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push