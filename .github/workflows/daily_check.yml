name: Daily Stock Analysis

on:
  schedule:
    # 18:00 WIB (11:00 UTC) - Sudah Benar
    - cron: '0 11 * * *'
  workflow_dispatch: # Agar bisa dijalankan manual

jobs:
  analyze:
    runs-on: ubuntu-latest
    # PENTING: Wajib ada permission write agar bot bisa push file signals.json
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        working-directory: stock-analyzer
        run: |
          python -m pip install --upgrade pip
          # Gunakan ini jika ada file requirements.txt
          pip install pandas yfinance 

      # CATATAN: Langkah 'Download Latest Data' dihapus karena sudah 
      # dipanggil di dalam run_daily.py (supaya tidak kerja dua kali)

      - name: Run Daily Analysis
        working-directory: stock-analyzer
        run: python scripts/run_daily.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # SARAN: JANGAN git add file .csv (idx/*.csv) ke GitHub. 
          # File CSV sangat besar dan akan membuat repo Anda lambat.
          # Cukup simpan signals.json yang dibutuhkan website.
          
          git add stock-analyzer/data/signals.json
          
          git commit -m "Auto-update: Daily Signals $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push